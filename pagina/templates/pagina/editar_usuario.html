{% extends 'pagina/base.html' %}
{% load static %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="seccion">
    <div class="seccion-content" style="max-width: 600px; text-align: left;">
        <h1 class="seccion-titulo mb-4">{{ titulo }}</h1>
        
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" class="form-control" value="{{ usuario.username }}" disabled>
                <small class="form-text text-muted" style="color: rgba(200, 230, 212, 0.7);">El nombre de usuario no se puede cambiar</small>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" value="{{ usuario.email }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Nombre Completo</label>
                <input type="text" name="nombre_completo" class="form-control" value="{{ usuario.nombre_completo }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Rol</label>
                <select name="rol" class="form-select" required>
                    {% for value, label in usuario.ROL_CHOICES %}
                        <option value="{{ value }}" {% if usuario.rol == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Nueva Contraseña (opcional)</label>
                <input type="password" name="password" class="form-control" placeholder="Deja en blanco para mantener la contraseña actual">
                <small class="form-text text-muted" style="color: rgba(200, 230, 212, 0.7);">Solo completa si deseas cambiar la contraseña</small>
            </div>
            <div class="form-check mb-4">
                <input type="checkbox" name="activo" class="form-check-input" id="activo" {% if usuario.activo %}checked{% endif %}>
                <label class="form-check-label" for="activo">Usuario Activo</label>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Guardar Cambios
                </button>
                <a href="{% url 'usuarios' %}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

<style>
    .form-control, .form-select {
        background: #2a2a2a;
        border: 1px solid rgba(200, 230, 212, 0.3);
        color: #ffffff;
    }
    .form-control:focus, .form-select:focus {
        background: #2a2a2a;
        border-color: #4CA150;
        color: #ffffff;
    }
    .form-check-input:checked {
        background-color: #4CA150;
        border-color: #4CA150;
    }
</style>
{% endblock %}
