<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - DMH</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💊</text></svg>">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #1a1a1a;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 40px;
            max-width: 450px;
            width: 100%;
            border: 1px solid rgba(200, 230, 212, 0.2);
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header img {
            max-width: 150px;
            margin-bottom: 20px;
        }
        .login-header h2 {
            color: #ffffff;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .login-header p {
            color: #c8e6d4;
            font-size: 14px;
        }
        .form-label {
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
        }
        .form-control {
            border-radius: 8px;
            border: 2px solid rgba(200, 230, 212, 0.3);
            padding: 12px 15px;
            transition: all 0.3s;
            background: #2a2a2a;
            color: #ffffff;
        }
        .form-control:focus {
            border-color: #4CA150;
            box-shadow: 0 0 0 0.2rem rgba(76, 161, 80, 0.25);
            background: #2a2a2a;
            color: #ffffff;
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        .btn-login {
            background: linear-gradient(135deg, #4CA150 0%, #2E7D32 100%);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            transition: all 0.3s;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #2E7D32 0%, #1B5E20 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 125, 50, 0.4);
        }
        .input-group-text {
            background: #2a2a2a;
            border: 2px solid rgba(200, 230, 212, 0.3);
            border-right: none;
            border-radius: 8px 0 0 8px;
            color: #c8e6d4;
        }
        .input-group .form-control {
            border-left: none;
            border-radius: 0 8px 8px 0;
        }
        .input-group:focus-within .input-group-text {
            border-color: #4CA150;
            background: #2a2a2a;
        }
        .alert {
            border-radius: 8px;
            border: none;
            padding: 14px 18px;
            font-size: 15px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            animation: slideInDown 0.3s ease;
            margin-bottom: 20px;
        }
        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .alert-success {
            background: #4CA150;
            border: none;
            color: #ffffff;
            position: relative;
            padding-left: 45px;
        }
        .alert-success::before {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            left: 18px;
            font-size: 16px;
        }
        .alert-danger,
        .alert-error {
            background: #f44336;
            border: none;
            color: #ffffff;
            position: relative;
            padding-left: 45px;
        }
        .alert-danger::before,
        .alert-error::before {
            content: '\f06a';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            left: 18px;
            font-size: 16px;
        }
        .alert-info {
            background: #2196F3;
            border: none;
            color: #ffffff;
            position: relative;
            padding-left: 45px;
        }
        .alert-info::before {
            content: '\f05a';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            left: 18px;
            font-size: 16px;
        }
        .alert-warning {
            background: #ff9800;
            border: none;
            color: #ffffff;
            position: relative;
            padding-left: 45px;
        }
        .alert-warning::before {
            content: '\f071';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            left: 18px;
            font-size: 16px;
        }
        .alert .btn-close {
            filter: brightness(0) invert(1);
            opacity: 0.9;
            padding: 0;
            margin-left: 15px;
            width: 20px;
            height: 20px;
        }
        .alert .btn-close:hover {
            opacity: 1;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="https://i.imgur.com/waCO9vZ.png" alt="Logo DMH">
                <h2>DISTRIBUIDORA DE MEDICAMENTOS HOMEOPÁTICOS</h2>
                <p>Sistema de Gestión de Notas de Crédito</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post" action="{% url 'login' %}" id="loginForm">
                {% csrf_token %}
                {% if form.errors %}
                    <div class="alert alert-danger">
                        {{ form.errors }}
                    </div>
                {% endif %}
                <div class="mb-4">
                    <label for="username" class="form-label">
                        <i class="fas fa-user"></i> Usuario
                    </label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-user"></i>
                        </span>
                        <input 
                            type="text" 
                            class="form-control" 
                            id="username" 
                            name="username" 
                            placeholder="Ingresa tu usuario"
                            value="{% if username_value %}{{ username_value }}{% endif %}"
                            required
                            autofocus
                        >
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock"></i> Contraseña
                    </label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input 
                            type="password" 
                            class="form-control" 
                            id="password" 
                            name="password" 
                            placeholder="Ingresa tu contraseña"
                            required
                        >
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-login">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </button>
            </form>

            <div class="mt-4 text-center">
                <small style="color: rgba(200, 230, 212, 0.7);">
                    <i class="fas fa-info-circle"></i> Usuarios de prueba disponibles
                </small>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
