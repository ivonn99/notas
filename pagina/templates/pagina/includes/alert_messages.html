{% comment %}
Componente modular: Mensajes de alerta
Uso: {% include 'pagina/includes/alert_messages.html' %}
{% endcomment %}
{% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        <i class="fas 
            {% if message.tags == 'success' %}fa-check-circle
            {% elif message.tags == 'error' or message.tags == 'danger' %}fa-exclamation-circle
            {% elif message.tags == 'warning' %}fa-exclamation-triangle
            {% else %}fa-info-circle{% endif %}">
        </i>
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
{% endif %}
